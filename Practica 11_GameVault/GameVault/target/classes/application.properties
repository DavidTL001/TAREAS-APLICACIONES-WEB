# Configuración de puerto y nombre de aplicación
server.port=8080
spring.application.name=GameVault

# ==========================================
# CONFIGURACIÓN DE BASE DE DATOS (MySQL)
# ==========================================
# Asegúrate de tener una base de datos creada llamada 'gamevaultdb' en MySQL Workbench
# TIP: Al agregar '?createDatabaseIfNotExist=true' al final de la URL, MySQL la creará por ti automáticamente si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/gamevaultdb?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=itson
# update: Crea las tablas si no existen o las actualiza, pero no las borra.
spring.jpa.hibernate.ddl-auto=update
# Muestra las consultas SQL en la consola para fines didácticos
spring.jpa.show-sql=true
<!-- BARRA DE BÚSQUEDA -->
<div style="margin-bottom: 30px;">
<form action="/juegos" method="get" style="display: flex; gap: 10px;">
<input type="text" name="buscar" th:value="${busquedaActual}" placeholder="Buscar juego por título..." style="flex: 1; padding: 10px; border-radius: 5px; border: 1px solid var(--bg-panel); background: var(--bg-panel); color: white;">
<button type="submit" class="btn btn-secondary">Buscar</button>
<a th:if="${busquedaActual != null}" href="/juegos" class="btn btn-secondary" style="background: var(--bg-panel);">Limpiar</a>
</form>
</div>