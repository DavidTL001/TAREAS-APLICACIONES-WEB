<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content ="width=device-width, initial-scale=1.0">
    <title>Nébula Music - registro</title>
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <form method="post" action="/crear-cuenta">

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" minlenght="3">
                <br><br>
                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo">
                <br><br>
                <label for="contrasenia">Contraseña:</label>
                <input type="password" id="contrasenia" name="contraseña">
                <br><br>
                <label for="txt_pseudonimo">Pseudonimo</label>
                <input
                        type="text"
                        id="txt_pseudonimo"
                        name="txt_pseudonimo"
                        pattern="[a-zA-Z]{3,10}-[0,9]{2,10}"
                >
                <br><br>
                <label>Género</label>
                <br>
                <input type="radio" id="masculino"  name="rad_genero" value="M">
                <label for="masculino">Masculino</label>
                <input type="radio" id="femenino"  name="rad_genero" value="F">
                <label for="femenino">Femenino</label>
                <input type="radio" id="otro"  name="rad_genero" value="O">
                <label for="otro">Otro</label>

                </select>

                <br><br>
                <label for="suscripcion">Suscripciòn:</label>
                <select id="suscripcion" name="sel_suscripcion">

                    <option value="gratis">Gratis</option>
                    <option value="mensual">Mensual</option>
                    <option value="anual">Anual</option>
                </select>

                <label for="fecha">Fecha de Nacimiento:</label>
                <input type="date" id="fecha" name="fechaNacimiento">
                <br><br>

                <input type="checkbox" id="terminos" name="chk_terminos" value="aceptado">
                <label for="terminos">Acepto los tèrminos y condiciones</label>

                <br><br>

                <label for="comentarios">Comentarios:</label>

                <textarea
                    id="comentarios"
                    name="comentarios"
                    rows="4" cols="40"
                    placeholder="Escribe aqui tus comentarios..."
                ></textarea>

                <br><br>
                <input type="submit">
                <input type="reset">



            </form>
        </section>
    </main>


</body>
</html>
