<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content ="width=device-width, initial-scale=1.0">
    <title>Nébula Music - registro</title>
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <form class="auth-form" method="post" action="/crear-cuenta" enctype="application/x-www-form-urlencoded">
            <!--<form method="post" action="/crear-cuenta">-->

                <div class="form-logo">
                    <img src="./imgs/nebula-03.svg" alt="Logo Nebula">
                </div>

                <div class="form-header">
                    <h3>Crear Cuenta</h3>
                    <p class="form-subtitle">Completa los datos para registrarte</p>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" minlenght="3" placeholder="Tu nombre completo">
                </div>

                <div class="form-group">
                    <label for="correo">Correo:</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@gorreo.com">
                </div>

                <div class="form-group">
                    <label for="contrasenia">Contraseña:</label>
                    <input type="password" id="contrasenia" name="contraseña" placeholder="Crea tu contrasenia">
                </div>

                <div class="form-group">
                    <label for="txt_pseudonimo">Pseudonimo</label>
                    <input
                            type="text"
                            id="txt_pseudonimo"
                            name="txt_pseudonimo"
                            pattern="[a-zA-Z]{3,10}-[0,9]{2,10}"
                    >
                </div>

                <div class="form-group">
                    <label>Género</label>
                    <br>
                    <input type="radio" id="masculino"  name="rad_genero" value="M">
                    <label for="masculino">Masculino</label>
                    <input type="radio" id="femenino"  name="rad_genero" value="F">
                    <label for="femenino">Femenino</label>
                    <input type="radio" id="otro"  name="rad_genero" value="O">
                    <label for="otro">Otro</label>

                    </select>
                </div>

                <div class="form-group">
                    <label for="suscripcion">Suscripciòn:</label>
                    <select id="suscripcion" name="sel_suscripcion">

                        <option value="gratis">Gratis</option>
                        <option value="mensual">Mensual</option>
                        <option value="anual">Anual</option>
                    </select>

                    <label for="fecha">Fecha de Nacimiento:</label>
                    <input type="date" id="fecha" name="fechaNacimiento">
                </div>

                <div class="form-group">
                    <input type="checkbox" id="terminos" name="chk_terminos" value="aceptado">
                    <label for="terminos">Acepto los tèrminos y condiciones</label>
                </div>

                <div class="form-group">
                    <label for="comentarios">Comentarios:</label>

                    <textarea
                        id="comentarios"
                        name="comentarios"
                        rows="4" cols="40"
                        placeholder="Escribe aqui tus comentarios..."
                    ></textarea>
                </div>

                <div class="form-group">
                    <input type="submit">
                    <input type="reset">
                </div>


            </form>
        </section>
    </main>


</body>
</html>
